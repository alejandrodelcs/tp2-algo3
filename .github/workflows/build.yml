name: build
on: [ push, pull_request ]
jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      - name: Start services
        run: scripts/start_services.sh
      - name: Run tests
        run: docker compose -f docker/docker-compose.yaml exec -T app bash scripts/build.sh
      - name: Copy JaCoCo report from container
        run: |
            APP_ID=$(docker compose -f docker/docker-compose.yaml ps -q app)
            docker cp $APP_ID:/usr/src/app/target/site/jacoco/jacoco.xml jacoco.xml
      - name: Upload coverage report
        uses: codecov/codecov-action@v2



  package:
    runs-on: ubuntu-latest
    needs: build
    if: contains(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
      - name: Start services
        run: scripts/start_services.sh
      - name: Package
        run: docker compose -f docker/docker-compose.yaml exec -T app bash scripts/package.sh
      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: target/tp2-*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
